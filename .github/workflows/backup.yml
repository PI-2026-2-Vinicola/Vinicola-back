# Backup da OASIS em produção, fora do Supabase (o plano gratuito não garante backups restauráveis).
#
# Todo dia: pg_dump do banco com o usuário somente leitura oasis_backup.
# Aos domingos (ou ao rodar à mão): cópia de todas as fotos do bucket.
# Os arquivos são criptografados (GPG, AES-256) antes de virar artefato: o repositório é público e
# qualquer pessoa logada no GitHub pode baixar artefatos. Sem a senha, o arquivo não serve para nada.
# Como restaurar: docs/nuvem.md, seção "Backups".
name: Backup

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em Recife
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Banco e fotos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    env:
      OASIS_BACKUP_PASSPHRASE: ${{ secrets.OASIS_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Confere os segredos
        env:
          OASIS_BACKUP_DATABASE_URL: ${{ secrets.OASIS_BACKUP_DATABASE_URL }}
        run: |
          for name in OASIS_BACKUP_DATABASE_URL OASIS_BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::Defina o secret $name no ambiente backup (docs/nuvem.md)."; exit 1; fi
          done

      - name: Instala o cliente mais recente do PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version

      - name: Exporta o banco (pg_dump) e criptografa
        env:
          OASIS_BACKUP_DATABASE_URL: ${{ secrets.OASIS_BACKUP_DATABASE_URL }}
        run: |
          umask 077
          mkdir -p saida
          stamp=$(date -u +%Y%m%d-%H%M)
          pg_dump "$OASIS_BACKUP_DATABASE_URL" --schema=public --format=custom --no-owner --no-privileges --file banco.dump
          pg_restore --list banco.dump | grep -c "TABLE DATA" | xargs echo "Tabelas com dados no dump:"
          printf '%s' "$OASIS_BACKUP_PASSPHRASE" > senha.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file senha.txt \
            --symmetric --cipher-algo AES256 --output "saida/oasis-banco-$stamp.dump.gpg" banco.dump
          rm -f banco.dump senha.txt
          ls -l saida

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Copia as fotos do bucket (domingos ou execução manual) e criptografa
        env:
          STORAGE_BACKEND: s3
          S3_ENDPOINT_URL: ${{ secrets.OASIS_BACKUP_S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.OASIS_BACKUP_S3_REGION }}
          S3_BUCKET: oasis-fotos
          S3_ACCESS_KEY_ID: ${{ secrets.OASIS_BACKUP_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.OASIS_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ "$(date -u +%u)" != 7 ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "Fotos: cópia só aos domingos."; exit 0
          fi
          if [ -z "$S3_ACCESS_KEY_ID" ]; then
            echo "::warning::Secrets OASIS_BACKUP_S3_* não definidos: fotos sem backup nesta execução."; exit 0
          fi
          umask 077
          pip install -q -r requirements.txt
          python -m app.cli baixar-fotos --out fotos
          stamp=$(date -u +%Y%m%d-%H%M)
          tar -czf fotos.tar.gz -C fotos .
          printf '%s' "$OASIS_BACKUP_PASSPHRASE" > senha.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file senha.txt \
            --symmetric --cipher-algo AES256 --output "saida/oasis-fotos-$stamp.tar.gz.gpg" fotos.tar.gz
          rm -rf fotos fotos.tar.gz senha.txt
          ls -l saida

      - name: Guarda os arquivos criptografados por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: saida/
          retention-days: 30
          if-no-files-found: error
